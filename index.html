<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>لوحة أهداف 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa:wght@500;700&family=Tajawal:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <h1>لوحة أهداف 2026</h1>
        <p>تصميم كلاسيكي minimal للتركيز على التنفيذ فقط.</p>
      </header>

      <section class="stats" aria-label="إحصائيات">
        <article class="box">
          <span>إجمالي الأهداف</span>
          <strong id="stat-total">0</strong>
        </article>
        <article class="box">
          <span>على المسار</span>
          <strong id="stat-ontrack">0</strong>
        </article>
        <article class="box">
          <span>مهدد / خارج المسار</span>
          <strong id="stat-risk">0</strong>
        </article>
        <article class="box">
          <span>متوسط الثقة</span>
          <strong id="stat-confidence">0%</strong>
        </article>
      </section>

      <section class="panel controls">
        <label>
          الحالة
          <select id="status-filter">
            <option value="all">الكل</option>
            <option value="on_track">على المسار</option>
            <option value="at_risk">مهدد</option>
            <option value="off_track">خارج المسار</option>
            <option value="completed">مكتمل</option>
          </select>
        </label>

        <label>
          بحث
          <input id="search-input" type="search" placeholder="ابحث باسم الهدف" autocomplete="off" />
        </label>

        <button id="focus-toggle" type="button" class="btn-secondary">وضع التركيز: إيقاف</button>
        <button id="clear-filters" type="button" class="btn-secondary">تصفير</button>
      </section>

      <p id="focus-note" class="focus-note"></p>

      <section class="panel form-panel">
        <h2>إضافة هدف</h2>
        <form id="goal-form" class="goal-form">
          <label>
            اسم الهدف
            <input id="goal-title" type="text" maxlength="100" required />
          </label>

          <label>
            الفئة
            <select id="goal-category">
              <option value="career">العمل</option>
              <option value="learning">التعلم</option>
              <option value="finance">المال</option>
              <option value="health">الصحة</option>
              <option value="personal">تطوير ذاتي</option>
            </select>
          </label>

          <label>
            الموعد النهائي
            <input id="goal-date" type="date" min="2026-01-01" max="2026-12-31" required />
          </label>

          <label>
            القيمة المستهدفة
            <input id="goal-target" type="number" min="1" step="1" value="10" required />
          </label>

          <label>
            القيمة الحالية
            <input id="goal-current" type="number" min="0" step="1" value="0" required />
          </label>

          <label class="full">
            لماذا تريد هذا الهدف؟
            <textarea id="goal-why" rows="2" maxlength="220" required></textarea>
          </label>

          <label class="full">
            ملاحظات (اختياري)
            <textarea id="goal-notes" rows="3" maxlength="220"></textarea>
          </label>

          <p id="smart-hint" class="hint"></p>
          <button type="submit" class="btn-primary">إضافة الهدف</button>
        </form>
        <p id="form-feedback" class="feedback" role="status" aria-live="polite"></p>
      </section>

      <section class="panel goals-panel">
        <div class="goals-head">
          <h2>قائمة الأهداف</h2>
          <span id="goals-count">0</span>
        </div>
        <div id="goals-list" class="goals-list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
